document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.22em;color:rgba(234,242,248,0.62)\">{{ kicker }}<\u002Fspan>\n          <span style=\"flex:1;height:1px;background:linear-gradient(to right,rgba(255,255,255,0.14),transparent)\"><\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.14em;font-variant-numeric:tabular-nums;color:rgba(234,242,248,0.34)\">{{ modIndex }} / {{ modCount }}<\u002Fspan>\n        <\u002Fdiv>\n\n        <h1 style=\"margin:0 0 16px;font-size:{{ headSize }};font-weight:700;line-height:1.04;letter-spacing:-0.015em;display:flex;flex-wrap:wrap;gap:0 0.28em;perspective:620px;text-wrap:balance\">\n          <sc-for list=\"{{ words }}\" as=\"w\" hint-placeholder-count=\"4\">\n            <span style=\"display:inline-flex\">\n              <sc-for list=\"{{ w.chars }}\" as=\"ch\" hint-placeholder-count=\"5\">\n                <span style=\"display:inline-block;color:{{ w.c }};animation:{{ ch.a }} 0.66s cubic-bezier(.16,.84,.44,1) both;animation-delay:{{ ch.d }}\">{{ ch.t }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fh1>\n\n        <p style=\"margin:0 0 16px;font-size:13px;line-height:1.7;color:rgba(230,239,246,0.78);max-width:62ch;text-wrap:pretty;animation:softIn 1s ease 0.24s both\">{{ copy }}<\u002Fp>\n\n        <div style=\"display:grid;grid-template-columns:{{ tileCols }};gap:8px\">\n          <sc-for list=\"{{ tiles }}\" as=\"tl\" hint-placeholder-count=\"4\">\n            <div style=\"grid-column:{{ tl.span }};border-radius:16px;border:1px solid {{ tl.bd }};background:{{ tl.bg }};box-shadow:{{ tl.sh }};transition:border-color .38s cubic-bezier(.16,.84,.44,1),background .38s ease,box-shadow .38s ease;overflow:hidden\" style-hover=\"border-color:rgba(255,255,255,0.24)\">\n              <button type=\"button\" sc-camel-on-click=\"{{ tl.pick }}\" style-active=\"transform:scale(0.988)\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border:none;background:transparent;cursor:pointer;font-family:inherit;text-align:left;transition:transform .16s ease\">\n                <span style=\"display:flex;align-items:center;gap:10px;min-width:0\">\n                  <span style=\"width:2px;height:24px;border-radius:2px;background:{{ tl.rule }};transition:background .34s ease;flex:0 0 auto\"><\u002Fspan>\n                  <span style=\"display:flex;flex-direction:column;gap:2px;min-width:0\">\n                    <span style=\"font-size:13px;font-weight:600;color:{{ tl.fg }};transition:color 0.3s ease\">{{ tl.t }}<\u002Fspan>\n                    <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.18em;color:rgba(234,242,248,0.58)\">{{ tl.s }}<\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fspan>\n                <span style=\"font-family:'IBM Plex Mono',monospace;font-size:15.6px;line-height:1;color:{{ tl.fg }};flex:0 0 auto\">{{ tl.sign }}<\u002Fspan>\n              <\u002Fbutton>\n              <sc-if value=\"{{ tl.open }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding:0 16px 16px;display:flex;flex-direction:column;gap:8px;animation:softIn 0.42s ease both\">\n                  <div style=\"height:1px;background:linear-gradient(to right,{{ tl.bd }},transparent)\"><\u002Fdiv>\n                  <sc-for list=\"{{ tl.rows }}\" as=\"rw\" hint-placeholder-count=\"3\">\n                    <div style=\"display:flex;align-items:baseline;gap:8px\">\n                      <span style=\"font-size:10.8px;color:rgba(230,239,246,0.62);flex:0 1 auto\">{{ rw.l }}<\u002Fspan>\n                      <span style=\"flex:1 1 16px;min-width:16px;height:1px;background:repeating-linear-gradient(to right,rgba(255,255,255,0.18) 0 1px,transparent 1px 4px);transform:translateY(-3px)\"><\u002Fspan>\n                      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.8px;letter-spacing:0.04em;font-variant-numeric:tabular-nums;color:rgba(240,247,252,0.94);text-align:right;flex:0 0 auto\">{{ rw.v }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                  <sc-if value=\"{{ tl.note }}\" hint-placeholder-val=\"{{ false }}\">\n                    <p style=\"margin:2px 0 0;font-size:11.5px;line-height:1.62;color:rgba(230,239,246,0.7);text-wrap:pretty\">{{ tl.note }}<\u002Fp>\n                  <\u002Fsc-if>\n                  <div style=\"display:inline-flex;align-self:flex-start;align-items:center;gap:8px;margin-top:4px;padding:5px 10px;border-radius:999px;border:1px solid {{ tl.bd }};background:rgba(255,255,255,0.03)\">\n                    <span style=\"width:4px;height:4px;border-radius:50%;background:{{ tl.fg }}\"><\u002Fspan>\n                    <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.2em;color:{{ tl.fg }}\">CAMERA → {{ tl.cam }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;align-items:flex-end;gap:8px;padding-bottom:8px;flex:{{ markFlex }}\">\n        <span style=\"font-size:{{ markSize }};font-weight:300;letter-spacing:0.01em;color:rgba(238,246,252,0.68);text-align:right;white-space:nowrap\">არვის მეგობარი — ყველას მოკავშირე.<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.3em;color:rgba(238,246,252,0.4)\">ARTRON<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;kinetic&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;autoTour&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;tourInterval&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:9,&quot;min&quot;:4,&quot;max&quot;:24,&quot;step&quot;:1,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;showWatermark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;}}\">\nconst TILES = [\n  { t: 'მასშტაბი', s: 'SCALE & CAPACITY' },\n  { t: 'დისციპლინები', s: 'DISCIPLINES' },\n  { t: 'საკვანძო ტექნოლოგია', s: 'TELEMETRY / RFID / BIO' },\n  { t: 'უმაღლესი სტანდარტი', s: 'COMPLIANCE' }\n];\n\nconst D1 = [\n  { n: 'ათლეტური ჰაბები', k: 'VEN-01 / MEMBERSHIP HUB', s: 'gym',\n    head: 'ერთი ჰაბი. სრული კონტროლი.',\n    copy: 'პიკის საათებში დარბაზი იტვირთება, ადმინისტრატორი ხელით ავსებს ჟურნალს და გაუქმებული აბონემენტები ჩუმად ჭამს შემოსავალს. Artron აერთიანებს წევრობას, შესვლის კონტროლს და აღჭურვილობის რეალურ დატვირთვას ერთ ცოცხალ სურათში — გადაწყვეტილება მიიღება მონაცემზე, არა ვარაუდზე.',\n    t: [[['საერთო ფართობი', '1 200–8 000 m²'], ['ერთდროული ტევადობა', '450 მომხმარებელი'], ['პიკის ფანჯარა', '18:00 – 21:30']],\n        [['ძალოვანი ზონა', 'Free weights · Rack'], ['ფუნქციური', 'HIIT · Cross · Mobility'], ['კარდიო ბლოკი', '64 ერთეული']],\n        [['წევრის იდენტიფიკაცია', 'RFID / NFC ბრასლეტი'], ['აღჭურვილობის ტელემეტრია', 'IoT 900+ სენსორი'], ['დატვირთვის რუკა', 'Heatmap 1 წთ ინტერვალი']],\n        [['პერსონალურ მონაცემთა დაცვა', 'GDPR · ISO 27001'], ['უსაფრთხოების აუდიტი', 'კვარტალური'], ['ხანძარსაწინააღმდეგო', 'EN 13501 კლასი B']]] },\n  { n: 'ოლიმპიური აუზები', k: 'VEN-02 / AQUATIC COMPLEX', s: 'pool',\n    head: 'წყალი, რომელიც თავად ანგარიშობს.',\n    copy: 'ქლორის ხელით გაზომვა, ბუნდოვანი ბილიკების განრიგი და მოცურავეთა რიგი კომპლექსს ყოველდღე ნერვიულობაში აგდებს. Artron წყლის ქიმიას, ბილიკების დატვირთვას და მაშველთა როტაციას ერთ პროტოკოლში კრავს და გადახრაზე რეაგირებს წუთებში, არა შემოწმების დღეს.',\n    t: [[['აუზის ზომა', '50 m · 8 ბილიკი'], ['წყლის მოცულობა', '2 500 m³'], ['დღიური ნაკადი', '1 100 მოცურავე']],\n        [['ცურვა', 'თავისუფალი · ბრასი · დელფინი'], ['წყლის პოლო', 'სრული მოედანი'], ['სინქრონული / დაივინგი', '3 m · 5 m პლატფორმა']],\n        [['წყლის ქიმია', 'pH · Cl · ORP realtime'], ['ბილიკის აღრიცხვა', 'ოპტიკური მრიცხველი'], ['ტემპერატურა', '±0.2 °C კონტროლი']],\n        [['FINA / World Aquatics', 'FR 2 სტანდარტი'], ['სანიტარული ნორმა', 'SanPiN ეკვივალენტი'], ['მაშველთა კოეფიციენტი', '1 : 75 მოცურავე']]] },\n  { n: 'ჩოგბურთი და პადელი', k: 'VEN-03 / COURT SYSTEMS', s: 'court',\n    head: 'კორტი, რომელიც არასდროს ცარიელია.',\n    copy: 'ჯავშნის გაუქმება ბოლო წუთს, გამორთული განათების ხარჯი და ტელეფონით დაჯავშნის ქაოსი კორტის მარჟას წლიურად ნახევრად ჭრის. Artron ავტომატურად ავსებს გამოთავისუფლებულ სლოტს ლოდინის სიიდან და განათებას მხოლოდ ნამდვილ თამაშზე რთავს.',\n    t: [[['კორტების რაოდენობა', '4 ჩოგბურთი · 6 პადელი'], ['სლოტის შევსება', '87% საშუალო'], ['დაჯავშნის ფანჯარა', '30 დღე წინ']],\n        [['ჩოგბურთი', 'Hard · Clay · Indoor'], ['პადელი', 'Panoramic glass'], ['სკვოში / ბადმინტონი', 'ოპციური ბლოკი']],\n        [['ჭკვიანი განათება', 'Presence-based LED'], ['მატჩის ანალიტიკა', 'Court cam · dwell'], ['წვდომა', 'QR · PIN კოდი']],\n        [['ITF / FIP', 'კორტის განზომილება'], ['განათების დონე', '500–750 lux'], ['დაზღვევა', 'პასუხისმგებლობის პოლისი']]] },\n  { n: 'დოჯოები და რინგი', k: 'VEN-04 / COMBAT ARTS', s: 'octagon',\n    head: 'ყოველი დარტყმა აღრიცხულია.',\n    copy: 'სპარინგის დატვირთვა ქაღალდზე იკარგება, წონითი კატეგორიები დღის ბოლოს იზომება და ტრავმა მაშინ ჩანს, როცა გვიანია. Artron სპარინგის მოცულობას, აღდგენას და წონის დინამიკას ერთ პროფილში აგროვებს — მწვრთნელი ხედავს რისკს მოვლენამდე.',\n    t: [[['საწვრთნელი ზონა', '2 თათამი · 1 რინგი'], ['ჯგუფის ზომა', '24 ათლეტი'], ['სესიები დღეში', '9 ბლოკი']],\n        [['ჭიდაობა / ძიუდო', 'IJF წესი'], ['კრივი / MMA', 'რინგი 6.1 m · გალია'], ['კარატე / ტაეკვონდო', 'WKF · WT კატა']],\n        [['სპარინგის ტელემეტრია', 'Impact G-sensor'], ['წონის კონტროლი', 'ბიოიმპედანსი'], ['ვიდეო განხილვა', '4 კამერა · slow-mo']],\n        [['ტრავმის პროტოკოლი', 'Concussion checklist'], ['სამედიცინო დაშვება', 'სავალდებულო ცნობა'], ['არასრულწლოვანთა ზედამხედველობა', 'ორმაგი თანხმობა']]] },\n  { n: 'არენები და სტადიონები', k: 'VEN-05 / MULTIPURPOSE ARENA', s: 'arena',\n    head: 'არენა ერთი ეკრანიდან.',\n    copy: 'ღონისძიებათა შორის გარდამავალი პერიოდი, ბილეთების არაცხადი ნაკადი და შესასვლელების რიგი არენას თითოეულ საღამოს გამოტოვებულ შემოსავლად უჯდება. Artron ერთ კონსოლში აერთიანებს კონფიგურაციის ცვლას, ნაკადის მართვას და კომერციულ ანალიტიკას.',\n    t: [[['დამსწრეთა ტევადობა', '12 000 ადგილი'], ['კონფიგურაციის ცვლა', '< 4 საათი'], ['ღონისძიება წელიწადში', '140+']],\n        [['საგუნდო სპორტი', 'კალათბურთი · ხელბურთი'], ['ფეხბურთი / რაგბი', 'სრული ბალახის მოედანი'], ['კონცერტი / კონგრესი', 'Stage 360° · end-stage']],\n        [['ნაკადის მართვა', 'Turnstile + LiDAR count'], ['ბილეთი და წვდომა', 'Dynamic QR · reseller API'], ['მოედნის მდგომარეობა', 'Turf moisture · temp']],\n        [['UEFA / FIBA ინფრასტრუქტურა', 'კატეგორია 3+'], ['ევაკუაცია', '8 წუთი სრული დარბაზი'], ['ხმაურის ნორმა', 'ღამის რეჟიმის ლიმიტი']]] }\n];\n\nconst D2 = [\n  { n: 'სამწვრთნელო შტაბი', k: 'HC-01 / COACHING STAFF', s: 'coach',\n    cams: ['STAFF FLOOR', 'GAME MODEL', 'GPS LOAD', 'LICENCE WALL'],\n    head: 'მწვრთნელი მიდის — მეთოდიკა რჩება.',\n    copy: 'დღეს სავარჯიშო გეგმა მწვრთნელის რვეულშია, ათლეტის პროგრესი — მის მეხსიერებაში. კადრი იცვლება და სამი სეზონის გამოცდილება მასთან ერთად მიდის. Artron მეთოდიკას, დატვირთვის ისტორიას და შეფასებებს კლუბის საერთო ბაზაში ინახავს — ახალი მწვრთნელი პირველივე დღეს ხედავს, სად გაჩერდა წინამორბედი.',\n    notes: ['მაგიდა ტაქტიკური დაფაა — წითელი და ლურჯი მაგნიტები ორი გუნდია. გარშემო ათი მიმართულების ხელმძღვანელი, წინ — მთავარი მწვრთნელი ბლოკნოტით.',\n      'ჰოლოგრამა მოედანია: კარები, საჯარიმოები, კონუსები და ბურთი. წერტილები მოთამაშეებია, ხაზები — პასები.',\n      'ათლეტს GPS ჟილეტი აცვია — ზურგის სენსორი სატელიტთან არის დაკავშირებული. წამზომი, რკალები და ხუთი დღის სვეტები დატვირთვას ზომავს.',\n      'ბეიჯი — მწვრთნელის ლიცენზია. ხუთიდან ერთი ქარვისფრად ციმციმებს — ვადა 30 დღეში იწურება, შეხსენება ავტომატურად მიდის.'],\n    t: [[['შტაბი', '34 სპეციალისტი · 10 მიმართულება'], ['მწვრთნელი / ათლეტი', '1 : 18'], ['დაგეგმვის ჰორიზონტი', 'მაკროციკლი · 12 თვე'], ['ახალი მწვრთნელის ადაპტაცია', 'კვირებიდან → 1 დღე']],\n        [['გამძლეობა', 'Endurance · tempo'], ['ძალა და სიმძლავრე', 'Strength · power'], ['ტექნიკა და ტაქტიკა', 'Skill · game model'], ['აღდგენა', 'Recovery · sleep']],\n        [['დატვირთვის მართვა', 'GPS · RPE · ACWR'], ['უსაფრთხო დიაპაზონი', 'ACWR 0.8 – 1.3'], ['სესიის ჟურნალი', 'ავტომატური ლოგი'], ['ვიდეო ანალიზი', 'Tag & share']],\n        [['მწვრთნელის ლიცენზია', 'ფედერაციის კატეგორია'], ['ვადის შეხსენება', '30 დღით ადრე'], ['ბავშვებთან მუშაობა', 'Safeguarding სერტიფიკატი'], ['შრომის ნორმა', 'კვირის საათების ლიმიტი']]] },\n  { n: 'ექიმები და რეაბილიტაცია', k: 'HC-02 / SPORTS MEDICINE', s: 'med',\n    cams: ['TREATMENT BAY', 'JOINT SCAN', 'BIOMETRICS', 'RTP GATES'],\n    head: 'ათლეტი ბრუნდება, როცა სხეული მზადაა.',\n    copy: 'სამედიცინო ჩანაწერი ფურცელზეა, მწვრთნელი ექიმს ტელეფონით ეკითხება და მოედანზე დაბრუნება ხშირად თარიღით წყდება, არა მზადყოფნით. Artron ერთ ბარათში აერთიანებს სკრინინგს, აღდგენის მაჩვენებლებს და დაბრუნების ოთხ ეტაპს — ექიმი და მწვრთნელი ერთსა და იმავე სურათს ხედავენ.',\n    notes: ['წითელი ჯვარი — სამედიცინო ბლოკი. ცენტრალურ საწოლზე ათლეტი წევს, გვერდით წვეთოვანი; ეკრანები — პაციენტის ცოცხალი ბარათი.',\n      'სკანერის რგოლი ათლეტის სხეულს გადის. მუხლებზე ქარვისფერი რგოლი — იქ დატვირთვა ნორმას აჭარბებს.',\n      'გული — პულსი და HRV, მთვარე — ძილი. დილის ეს მონაცემები წყვეტს, რამდენი დატვირთვა ეკუთვნის დღეს.',\n      'ყავარჯნებიდან ბურთამდე ოთხი თაღია — დაბრუნების ოთხი ეტაპი. ათლეტი სამს გადის, მეოთხე ექიმის ხელმოწერას ელის.'],\n    t: [[['სამედიცინო შტაბი', '9 ექიმი · 12 რეაბილიტოლოგი'], ['ათლეტის ბარათი', '1 400 აქტიური'], ['სკრინინგი', 'კვარტალში ერთხელ'], ['ექიმი ↔ მწვრთნელი', 'ერთი საერთო ბარათი']],\n        [['ორთოპედია', 'სახსარი · მყესი'], ['ფიზიოთერაპია', 'Manual · instrumental'], ['ფუნქციური დიაგნოსტიკა', 'VO₂max · ლაქტატი'], ['კვება და წონა', 'სპორტული დიეტოლოგი']],\n        [['დილის შემოწმება', 'HRV · ძილი · SpO₂'], ['რისკის ქულა', 'ყოველდღიური · 0–100'], ['სახსრის ასიმეტრია', '> 10% → სიგნალი'], ['დაბრუნების ეტაპები', 'RTP gate-checks']],\n        [['სამედიცინო მონაცემები', 'GDPR Art. 9 რეჟიმი'], ['წვდომა', 'მხოლოდ ექიმი + ათლეტი'], ['ანტიდოპინგი', 'WADA · TUE აღრიცხვა'], ['პირველადი დახმარება', 'AED · BLS გუნდი']]] },\n  { n: 'ფიტნეს-ინსტრუქტორები', k: 'HC-03 / GROUP LEADERS', s: 'group',\n    cams: ['STUDIO FLOOR', 'CLASS ZONES', 'HR BOARD', 'SPACING / CERT'],\n    head: 'სავსე დარბაზი, არა სავსე განრიგი.',\n    copy: 'ცარიელი გაკვეთილი ისევე ძვირია, როგორც გადატვირთული: ინსტრუქტორის საათი გადახდილია, დარბაზი დაკავებულია, შემოსავალი კი არ არის. Artron განრიგს რეალურ მოთხოვნაზე აგებს, გათავისუფლებულ ადგილს ლოდინის სიიდან ავსებს და ინსტრუქტორის შედეგს დასწრებით ზომავს.',\n    notes: ['ინსტრუქტორი სარკის წინ, 20 მონაწილე ხალიჩებზე. ოთხი ცარიელი ქარვისფერი ადგილი ლოდინის სიიდან ივსება.',\n      'სამი კუთხე — სამი ფორმატი: ველოსტუდია მხედრებით, იოგას წრე და TRX გირებით.',\n      'გულის ქვეშ თითო სვეტი ერთი მონაწილის პულსია, ფერი — ზონა. ბარათი NFC წამკითხველს ეხება — დასწრება დაფიქსირდა.',\n      'მონიშნული კვადრატი — ერთი მონაწილის ნორმატიული ფართობი. ლენტიანი ოქროს ბეჭედი — ინსტრუქტორის სერტიფიკატი.'],\n    t: [[['ჯგუფური გაკვეთილი', '180 კვირაში'], ['საშუალო დასწრება', '82%'], ['ინსტრუქტორები', '46 პირი'], ['ადგილის ხელახლა შევსება', '< 15 წუთი']],\n        [['ცეკვა და კარდიო', 'Zumba · step · cycle'], ['გონება და სხეული', 'Yoga · pilates · stretch'], ['ფუნქციური', 'TRX · kettlebell · circuit'], ['ახალი ფორმატი', '4-კვირიანი პილოტი']],\n        [['დაჯავშნა', 'აპლიკაცია + ლოდინის სია'], ['დასწრება', 'NFC check-in'], ['გულისცემის ზონები', 'Live HR ეკრანი'], ['გაკვეთილის შეფასება', '1 შეხებით, გასვლისას']],\n        [['ინსტრუქტორის სერტიფიკატი', 'EREPS დონე 3+'], ['დარბაზის ნორმა', '≥ 4 m² მონაწილეზე'], ['ჯანმრთელობის კითხვარი', 'PAR-Q · პირველ ვიზიტზე'], ['პირველადი დახმარება', 'CPR ყოველ ცვლაში']]] },\n  { n: 'ადმინისტრაცია და ოპერაციები', k: 'HC-04 / OPS & COMPLIANCE', s: 'ops',\n    cams: ['ROTA RING', 'DEPARTMENT PODS', 'SERVER / CLOCK-IN', 'AUDIT LEDGER'],\n    head: 'აუდიტი — ჩვეულებრივი სამშაბათი.',\n    copy: 'ცვლების გრაფიკი ექსელშია, შვებულება მესენჯერში, ხელფასი ხელით ითვლება — შემოწმების წინ კი დოკუმენტების აღდგენას ერთი კვირა სჭირდება. Artron ცვლებს, ხელშეკრულებებს და ბრძანება №01-15/ნ-ის მოთხოვნებს ერთ რეესტრში კრავს, რომლის შეცვლაც კვალის დატოვების გარეშე შეუძლებელია.',\n    notes: ['რგოლი 24-საათიანი საათია: მზე — დღის ცვლა, მზის ჩასვლა — საღამოს, მთვარე — ღამის. წერტილები თანამშრომლებია.',\n      'ოთხი სამსახური: რეცეფცია ზარით, ტექნიკური — ხელსაწყოების ყუთი, დასუფთავება — ვედრო და ჯოხი, დაცვა — კამერა.',\n      'თანამშრომელი თითის ანაბეჭდით აღირიცხება — ყოველი შესვლა მონეტად ემატება ხელფასის სვეტს.',\n      'ბეჭდიანი დოკუმენტი რეესტრში ჩადის და ბლოკად იქცევა. ძველი ბლოკი ვერ შეიცვლება — ოქროს ზედა ბლოკი დღის ბოლოა.'],\n    t: [[['პერსონალი', '210 თანამშრომელი'], ['ცვლები', '24/7 · 3 ცვლა'], ['დოკუმენტის მოძიება', '< 30 წამი'], ['აუდიტისთვის მზადება', 'კვირიდან → 1 საათამდე']],\n        [['რეცეფცია და გაყიდვები', 'Front desk · CRM'], ['ტექნიკური სამსახური', 'Maintenance · HVAC'], ['დასუფთავება', 'Housekeeping'], ['უსაფრთხოება', 'Security · CCTV']],\n        [['ცვლების დაგეგმვა', 'Auto-rota + ღირებულება'], ['დროის აღრიცხვა', 'Biometric clock-in'], ['ხელფასი', 'საათებიდან ავტომატურად'], ['ინციდენტების ჟურნალი', 'ციფრული · დროის ნიშნით']],\n        [['ბრძანება №01-15/ნ', 'სრული შესაბამისობა'], ['შრომის უსაფრთხოება', 'ISO 45001'], ['შრომის კოდექსი', 'ზეგანაკვეთის ლიმიტი'], ['აუდიტის კვალი', 'უცვლელი ჟურნალი']]] },\n  { n: 'მაშველთა კორპუსი', k: 'HC-05 / WATER SAFETY', s: 'guard',\n    cams: ['BASIN OVERVIEW', 'SCAN CONES', 'RESPONSE MESH', 'DRILL BEACON'],\n    head: 'ყოველი წამი დათვლილია.',\n    copy: 'მაშველის ყურადღება 20 წუთის შემდეგ ეცემა, პოზიციების როტაცია ზეპირად ხდება და სავარჯიშო ტრევოგა თვეებით ჩამორჩება გრაფიკს. Artron მართავს როტაციას, ფიქსირებს რეაგირების დროს და ავტომატურად აგებს უსაფრთხოების ანგარიშს.',\n    t: [[['მაშველთა კორპუსი', '28 პირი'], ['დაფარვის ზონა', '4 აუზი · 1 აკვაპარკი'], ['როტაციის ინტერვალი', '20 წუთი']],\n        [['ზედაპირის მეთვალყურეობა', 'Scan-10/20 პროტოკოლი'], ['წყალქვეშა სამაშველო', 'Deep-water rescue'], ['პირველადი დახმარება', 'CPR · AED · spinal']],\n        [['რეაგირების ტაიმერი', 'Alarm-to-contact log'], ['ხედვის კონტროლი', 'Underwater detection'], ['ტრევოგის ღილაკი', 'Poolside panic mesh']],\n        [['ILS სტანდარტი', 'საერთაშორისო რეკომენდაცია'], ['სერტიფიცირება', 'ყოველწლიური რე-ატესტაცია'], ['სავარჯიშო ტრევოგა', 'თვეში ერთხელ']]] }\n];\nconst D3 = [\n  { n: 'საერთაშორისო ოსტატები', k: 'MST-01 / MSIC ELITE', s: 'trophy',\n    cams: ['ELITE RING', 'DISCIPLINE BANNERS', 'MOCAP VOLUME', 'PROTOCOL CHAIN'],\n    head: 'ელიტა მოითხოვს დამტკიცებულ ისტორიას.',\n    copy: 'საერთაშორისო კლასის ოსტატი ქვეყანაში ათეულებით ითვლება — და თითოეულის სტატუსი დოკუმენტების ჯაჭვზე დგას: ოქმი, ლიცენზია, საზღვარგარეთული სტარტი, ანტიდოპინგური ისტორია. დღეს ეს ჯაჭვი საქაღალდეებშია გაფანტული და ერთი წარდგინების აწყობას კვირები სჭირდება. Artron თითოეულ ათლეტს ერთ ვერიფიცირებულ დოსიედ კრებს: რა შესრულდა, რა დარჩა და რომელ სტარტზე იხურება ნორმატივი.',\n    notes: ['ელიტა ერთეულებით ითვლება — ამიტომ 3D-ში თითოეული ათლეტი ცალკე წერტილია ციკლის რგოლზე, არა საერთო სია.',\n      'ყოველ დისციპლინას თავისი ნორმატივი და ოქმის ფორმა აქვს — სისტემა მათ ერთ შედარებად ენაზე თარგმნის.',\n      'მოძრაობის ჩანაწერი და მსოფლიო რეიტინგი ერთ პროფილშია — ტექნიკის დაცემა ჩანს შედეგის დაცემამდე.',\n      'სტატუსი მაშინ იბადება, როცა ჯაჭვის ყველა რგოლი ხელმოწერილია — სცენაზე ჩანს, რომელი რგოლი აკლია.'],\n    t: [[['MSIC ათლეტი', '37 აქტიური'], ['საერთაშორისო სტარტი', '9 წელიწადში'], ['ოლიმპიური ციკლი', '4 წელი · 3 მეოთხედი გავლილი'], ['დოსიეს აწყობა', 'კვირებიდან → 2 საათამდე']],\n        [['ინდივიდუალური', 'მძლეოსნობა · ცურვა · ძალოსნობა'], ['საბრძოლო', 'ჭიდაობა · ძიუდო · კრივი'], ['გუნდური', 'რაგბი · კალათბურთი'], ['ნორმატივის წყარო', 'თითო ფედერაციის ცხრილი']],\n        [['შედეგის ვერიფიკაცია', 'ოქმის ციფრული ხელმოწერა'], ['ბიომექანიკა', 'Motion capture 240 fps'], ['შედარებითი ანალიტიკა', 'World-rank benchmark'], ['გადახრის სიგნალი', 'ტექნიკის რეგრესი 7 დღეში']],\n        [['ნორმატივი', 'ეროვნული კლასიფიკაცია'], ['ანტიდოპინგი', 'WADA · ADAMS whereabouts'], ['წარდგინება', 'სამინისტროს რეგლამენტი'], ['დოკუმენტის ჯაჭვი', '4 ოქმიდან 3 დადასტურებული']]] },\n  { n: 'ოსტატები და ჩემპიონები', k: 'MST-02 / MASTERS & CHAMPIONS', s: 'podium',\n    cams: ['PODIUM & SEASON RING', 'CATEGORY LADDER', 'RESULT → RANK CHAIN', 'CLASSIFICATION CODEX'],\n    head: 'ჩემპიონი არ იბადება — აღირიცხება.',\n    copy: 'ოსტატის წოდება სამი რგოლის ნამრავლია: სტარტი, შედეგი და ხელმოწერილი ოქმი. დღეს სამივე სხვადასხვა ფედერაციის ცხრილშია და ჯაჭვის აღდგენა ყოველ ჯერზე ხელით იწყება — ამიტომ იკარგება წოდებები, რომლებიც ფაქტობრივად უკვე მოპოვებულია. Artron სტარტს, მედალს და ოქმს ერთ რეესტრში კრავს და აჩვენებს, რამდენი რჩება წოდებამდე.',\n    notes: ['სეზონის რგოლზე თითოეული სტარტია აღნიშნული — ოქროთი ის, რომელიც მედალში გადაიზარდა.',\n      'კატეგორია და ლიგა განსაზღვრავს, რომელი შედეგი ითვლება წოდებაში — კიბე აჩვენებს მოქმედ საფეხურს.',\n      'შედეგი ოქმად, ოქმი წოდებად — ჯაჭვი ავტომატურია და თითოეული რგოლი გადამოწმებადია.',\n      'სადავო შედეგი რეიტინგში არ ჩაითვლება, სანამ აპელაციის ფანჯარა ღიაა — წოდება მხოლოდ სუფთა ჯაჭვზე დგება.'],\n    t: [[['ოსტატის წოდება', '124 მფლობელი'], ['სეზონური სტარტი', '46 ტურნირი'], ['მედლის კონვერსია', '31%'], ['წოდებამდე მანძილი', 'საშუალოდ 2 სტარტი']],\n        [['ეროვნული ჩემპიონატი', 'ყველა წონითი კატეგორია'], ['თასების სისტემა', 'Cup · league'], ['ვეტერანთა კლასი', 'Masters 35+'], ['კატეგორიის ცვლა', 'წონის ისტორიით დადასტურებული']],\n        [['შედეგის ჯაჭვი', 'Result → protocol → rank'], ['რეიტინგის ძრავა', 'Elo-ტიპის მოდელი'], ['მედალიონის RFID', 'ნამდვილობის შემოწმება'], ['ოქმის მიღება', 'ფედერაციის API · ავტომატური']],\n        [['კლასიფიკაცია', 'ფედერაციის წესდება'], ['მოსამართლის დაშვება', 'ლიცენზიის რეესტრი'], ['აპელაცია', '72 საათიანი ფანჯარა'], ['სადავო შედეგი', 'გაყინული გადაწყვეტამდე']]] },\n  { n: 'ოსტატობის კანდიდატები', k: 'MST-03 / CMS PIPELINE', s: 'passport',\n    head: 'კანდიდატი ერთ ნორმატივს აკლია.',\n    copy: 'კანდიდატები ყველაზე ხშირად სისტემის უყურადღებობის გამო იკარგებიან: ნორმატივი ვადაზე გამოტოვდა, სტარტი არ დაიფიქსირდა, დოკუმენტი დაგვიანდა. Artron თითოეულ კანდიდატს აძლევს ცხად რუკას — რა დარჩა, რომელ ტურნირზე და რა ვადამდე.',\n    t: [[['CMS კანდიდატი', '268 ათლეტი'], ['საშუალო ასაკი', '17.4 წელი'], ['გადასვლის მაჩვენებელი', '22% წელიწადში']],\n        [['სასტარტო კალენდარი', 'რეგიონული → ეროვნული'], ['ტესტირების ბატარეა', 'Speed · power · VO₂'], ['საკვალიფიკაციო ჯგუფები', '6 დისციპლინა']],\n        [['ნორმატივის ტრეკერი', 'Gap-to-standard %'], ['პროგრესის მრუდი', '12-თვიანი ტრენდი'], ['დატვირთვის ბალანსი', 'ACWR 0.8–1.3']],\n        [['ასაკობრივი ლიმიტი', 'ფედერაციის ჩარჩო'], ['სამედიცინო დაშვება', 'წლიური სკრინინგი'], ['მშობლის თანხმობა', 'არასრულწლოვანებზე']]] },\n  { n: 'I, II, III თანრიგი', k: 'MST-04 / RANKED ATHLETES', s: 'medals',\n    head: 'თანრიგი — მასის ნამდვილი რუკა.',\n    copy: 'ათასობით თანრიგიანი ათლეტი ქაღალდის ცნობებში იმალება და კლუბს არ აქვს პასუხი მარტივ კითხვაზე: ვინ სად დგას დღეს. Artron თანრიგებს ციფრულ რეესტრად აქცევს — ვადები, გადამოწმება და მასობრივი ატესტაცია ერთ ნაკადში.',\n    t: [[['რეესტრის მოცულობა', '3 120 ათლეტი'], ['თანრიგის განაწილება', 'I 14% · II 33% · III 53%'], ['ატესტაცია', 'წელიწადში ორჯერ']],\n        [['საოლიმპიური სპორტი', '18 დისციპლინა'], ['არაოლიმპიური', '11 დისციპლინა'], ['სასკოლო ლიგა', 'რეგიონული ეტაპები']],\n        [['ციფრული ცნობა', 'QR-ვერიფიკაცია'], ['მასობრივი ტესტი', 'Bulk import · scoring'], ['ვადის კონტროლი', 'ავტო-შეტყობინება']],\n        [['ეროვნული კლასიფიკაცია', 'დამტკიცებული ცხრილი'], ['მონაცემთა მინიმიზაცია', 'GDPR პრინციპი'], ['რეესტრის აუდიტი', 'წლიური შემოწმება']]] },\n  { n: 'იუნიორთა აკადემიები', k: 'MST-05 / YOUTH ACADEMY', s: 'academy',\n    cams: ['AGE-STEP COHORTS', 'SPECIALISATION PODS', 'GROWTH & SKILL PANEL', 'CONSENT GATE'],\n    head: 'ნიჭი ადრე ჩანს. მონაცემი გვიან.',\n    copy: 'აკადემიის ღირებულება ერთ კითხვაზე დგას: რომელი ბავშვი ვითარდება და რომელი გვტოვებს. დღეს დასწრება რვეულშია, ზრდის მრუდი — არსად, მშობელი კი მესენჯერში იღებს ინფორმაციას. Artron U8–U18 ტრაექტორიას ერთ ხაზად აწყობს: ასაკობრივი საფეხური, ზრდის პიკი, უნარების ბარათი და გასვლის სიგნალი ერთად ჩანს, მშობლის წვდომა კი დალუქულ რეჟიმშია.',\n    notes: ['კიბის თითოეული საფეხური ცალკე კოჰორტაა — ჩანს, სად ვიწროვდება ნაკადი და სად ჩერდება ზრდა.',\n      'ადრეული ვიწრო სპეციალიზაცია ნიჭს კლავს — სისტემა ბაზისის წილს ასაკის მიხედვით აკონტროლებს.',\n      'ზრდის პიკი ტრავმის ყველაზე მაღალი რისკია — მრუდი, უნარების ბარათი და დატვირთვა ერთ ეკრანზე იკითხება.',\n      'ბავშვის მონაცემზე წვდომა დალუქულია და აღირიცხება — თანხმობის გარეშე კარი არ იღება.'],\n    t: [[['აღსაზრდელი', '1 850 ბავშვი'], ['ასაკობრივი საფეხური', 'U8 – U18 · 6 საფეხური'], ['შენარჩუნება', '74% სეზონზე'], ['გასვლის სიგნალი', '3 გაცდენა ზედიზედ']],\n        [['საბაზისო მომზადება', 'ABC · coordination'], ['სპეციალიზაცია', '9 მიმართულება'], ['სასწავლო მატჩები', 'ლიგა + ფესტივალი'], ['ადრეული სპეციალიზაცია', 'შეზღუდული U12-მდე']],\n        [['ზრდის მონიტორინგი', 'PHV · სიმაღლის მრუდი'], ['უნარების ბარათი', 'Skill matrix 18 პარამეტრი'], ['მშობლის პორტალი', 'Read-only წვდომა'], ['დატვირთვა ზრდის პიკზე', 'ავტომატური შემცირება']],\n        [['COPPA', 'მშობლის ვერიფიცირებული თანხმობა'], ['GDPR-K', 'მონაცემთა მინიმიზაცია'], ['Safeguarding', 'პერსონალის შემოწმება'], ['წვდომის ჟურნალი', 'ვინ ნახა ბავშვის მონაცემი']]] }\n];\n\nconst DIMS = [\n  { num: 'I', name: 'სპორტული სივრცეები', sub: 'VENUES & INFRASTRUCTURE', accent: '#00FF88', mods: D1 },\n  { num: 'II', name: 'ადამიანური კაპიტალი', sub: 'WORKFORCE & PROFESSIONALS', accent: '#00F0FF', mods: D2 },\n  { num: 'III', name: 'ოსტატობა და ტიტულები', sub: 'MASTERY & SPORTS RANKS', accent: '#FFD700', mods: D3 }\n];\n\nclass Component extends DCLogic {\n  state = { d: 0, m: 0, tile: null, rev: 0, w: window.innerWidth };\n\n  componentDidMount() {\n    this._onR = () => { if (Math.abs(window.innerWidth - this.state.w) > 40) this.setState({ w: window.innerWidth }); };\n    window.addEventListener('resize', this._onR);\n    this._onK = e => {\n      if (e.key === 'ArrowRight') this.step(1);\n      else if (e.key === 'ArrowLeft') this.step(-1);\n      else if (e.key === 'Escape') this.setState({ tile: null });\n    };\n    window.addEventListener('keydown', this._onK);\n    this._tour();\n  }\n\n  componentDidUpdate(prev) {\n    if (prev.autoTour !== this.props.autoTour || prev.tourInterval !== this.props.tourInterval) this._tour();\n  }\n\n  _tour() {\n    clearInterval(this._tv);\n    if (!this.props.autoTour) return;\n    const ms = (this.props.tourInterval ?? 9) * 1000;\n    this._tv = setInterval(() => this.setState(s => {\n      const mods = DIMS[s.d].mods;\n      const next = s.m + 1;\n      return next < mods.length\n        ? { m: next, tile: null, rev: s.rev + 1 }\n        : { d: (s.d + 1) % DIMS.length, m: 0, tile: null, rev: s.rev + 1 };\n    }), ms);\n  }\n\n  componentWillUnmount() { window.removeEventListener('resize', this._onR); window.removeEventListener('keydown', this._onK); clearInterval(this._tv); }\n\n  step(dir) {\n    this.setState(s => {\n      const n = DIMS[s.d].mods.length;\n      let m = s.m + dir, d = s.d;\n      if (m >= n) { d = (s.d + 1) % DIMS.length; m = 0; }\n      else if (m < 0) { d = (s.d + DIMS.length - 1) % DIMS.length; m = DIMS[d].mods.length - 1; }\n      return { d, m, tile: null, rev: s.rev + 1 };\n    });\n  }\n\n  pickDim(i) { this.setState(s => ({ d: i, m: 0, tile: null, rev: s.rev + 1 })); }\n  pickMod(i) { this.setState(s => ({ m: i, tile: null, rev: s.rev + 1 })); }\n  pickTile(i) { this.setState(s => ({ tile: s.tile === i ? null : i })); }\n\n  renderVals() {\n    const { d, m, tile, rev, w } = this.state;\n    const narrow = w < 830;\n    const tiny = w < 620;\n    const dim = DIMS[d];\n    const mods = dim.mods;\n    const mi = Math.min(m, mods.length - 1);\n    const mod = mods[mi];\n    const accent = dim.accent;\n    const kin = this.props.kinetic ?? true;\n    const anim = kin ? (rev % 2 ? 'kinB' : 'kinA') : 'softIn';\n    const raw = mod.head.split(' ');\n    const closed = TILES.map((_, i) => i).filter(i => i !== tile);\n    const lastClosed = closed.length % 2 ? closed[closed.length - 1] : -1;\n    let ci = 0;\n    const words = raw.map((word, wi) => ({\n      c: wi === raw.length - 1 ? accent : '#f4f9fd',\n      chars: word.split('').map(t => {\n        const delay = kin ? (wi * 0.05 + ci * 0.022) : wi * 0.03;\n        ci++;\n        return { t, a: anim, d: delay.toFixed(3) + 's' };\n      })\n    }));\n    return {\n      accent,\n      tint: accent + '1f',\n      scene: mod.s,\n      kicker: mod.k,\n      copy: mod.copy,\n      words,\n      focus: tile === null ? '' : String(tile),\n      shift: narrow ? 0 : 0.42,\n      next: () => this.step(1),\n      ticks: mods.map((x, i) => ({\n        label: x.n, pick: () => this.pickMod(i),\n        w: i === mi ? '34px' : '14px',\n        bg: i === mi ? accent : '#eaf2f8',\n        op: i === mi ? 1 : (i === (mi + 1) % mods.length ? 0.5 : 0.22)\n      })),\n      modIndex: String(mi + 1).padStart(2, '0'),\n      modCount: String(mods.length).padStart(2, '0'),\n      pad: tiny ? '16px 16px 24px' : (narrow ? '24px 24px 24px' : '32px 40px 40px'),\n      hudW: narrow ? '100%' : 'clamp(400px, 40vw, 600px)',\n      hudMax: tiny ? '48vh' : (narrow ? '52vh' : '72vh'),\n      hudPad: tiny ? '16px' : '24px',\n      headSize: tiny ? '27px' : (narrow ? '32.4px' : 'clamp(32.4px, 3.2vw, 46.7px)'),\n      tileCols: tiny ? '1fr' : 'repeat(2, minmax(0, 1fr))',\n      markFlex: narrow ? '1 1 100%' : '0 0 auto',\n      markSize: tiny ? '10.8px' : '13px',\n      dims: DIMS.map((x, i) => ({\n        num: x.num, name: x.name, tag: x.sub, pick: () => this.pickDim(i),\n        bg: i === d ? 'rgba(255,255,255,0.1)' : 'transparent',\n        fg: i === d ? '#f7fbfe' : 'rgba(234,242,248,0.56)',\n        rule: i === d ? x.accent : 'rgba(255,255,255,0.14)',\n        sub: i === d ? x.accent : 'rgba(234,242,248,0.34)'\n      })),\n      mods: mods.map((x, i) => ({\n        n: x.n, pick: () => this.pickMod(i),\n        bg: i === mi ? accent : 'rgba(255,255,255,0.05)',\n        fg: i === mi ? '#050811' : 'rgba(234,242,248,0.74)',\n        bd: i === mi ? accent : 'rgba(255,255,255,0.1)',\n        dot: i === mi ? 'rgba(5,8,17,0.45)' : (i === (mi + 1) % mods.length ? accent : 'rgba(255,255,255,0.22)'),\n        pulse: i === (mi + 1) % mods.length ? 'pulseHint 2.6s ease-in-out infinite' : 'none'\n      })),\n      tiles: TILES.map((tl, i) => ({\n        t: tl.t, s: tl.s, open: tile === i, sign: tile === i ? '–' : '+',\n        pick: () => this.pickTile(i),\n        span: !tiny && (tile === i || i === lastClosed) ? 'span 2' : 'auto',\n        cam: (mod.cams || ['WIDE ESTABLISH', 'DISCIPLINE PASS', 'TECH CLOSE-UP', 'STANDARD SWEEP'])[i],\n        note: (mod.notes || [])[i] || '',\n        bg: tile === i ? 'rgba(255,255,255,0.065)' : 'rgba(255,255,255,0.028)',\n        bd: tile === i ? accent + '66' : 'rgba(255,255,255,0.08)',\n        rule: tile === i ? accent : 'rgba(255,255,255,0.12)',\n        sh: tile === i ? 'inset 0 0 0 1px rgba(255,255,255,0.04), 0 14px 34px rgba(0,0,0,0.34)' : 'none',\n        fg: tile === i ? accent : '#eaf2f8',\n        rows: (mod.t[i] || []).map(r => ({ l: r[0], v: r[1] }))\n      }))\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"

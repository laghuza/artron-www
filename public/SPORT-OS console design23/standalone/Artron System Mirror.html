<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="ext-resource-dependency" content="https://unpkg.com/three@0.184.0/build/three.module.js" data-resource-id="threeModule" />
<meta name="ext-resource-dependency" content="https://unpkg.com/three@0.184.0/build/three.core.js" data-resource-id="threeCore" />
<script src="../support.js"></script>
<script src="./artron-scene.js"></script>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#060911"><svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg"><rect width="1200" height="800" fill="#060911"/><circle cx="600" cy="400" r="170" fill="none" stroke="#00f0ff" stroke-width="14"/><path d="M600 290 L690 490 L510 490 Z" fill="none" stroke="#ffd700" stroke-width="14"/></svg></template>
<x-dc>

<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #060911; }
  * { box-sizing: border-box; }
  a { color: #7fe8b8; text-decoration: none; }
  a:hover { color: #ffffff; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 6px; }
  @keyframes kinA { from { opacity: 0; transform: translate3d(0, 0.62em, 0) rotateX(-58deg); filter: blur(7px); } to { opacity: 1; transform: none; filter: blur(0); } }
  @keyframes kinB { from { opacity: 0; transform: translate3d(0, -0.5em, 0) scale(1.24); filter: blur(9px); } to { opacity: 1; transform: none; filter: blur(0); } }
  @keyframes softIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes hudUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes breathe { 0%, 100% { opacity: 0.34; } 50% { opacity: 0.8; } }
  @keyframes pulseHint { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.20); } 70% { box-shadow: 0 0 0 9px rgba(255,255,255,0); } 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); } }
  button:focus-visible { outline: 1px solid rgba(255,255,255,0.55); outline-offset: 2px; }
</style>
</helmet>
<div style="position:relative;width:100%;height:100vh;min-height:600px;overflow:hidden;background:#060911;color:#eaf2f8;font-family:'Noto Sans Georgian',system-ui,sans-serif;-webkit-font-smoothing:antialiased">

  <x-import component-from-global-scope="artron-scene" variant="{{ scene }}" accent="{{ accent }}" focus="{{ focus }}" shift="{{ shift }}" hint-size="100%,100%" style="position:absolute;inset:0;width:100%;height:100%"></x-import>

  <div style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(115% 85% at 62% 18%, rgba(6,9,17,0) 38%, rgba(4,6,12,0.62) 82%, rgba(3,5,10,0.9) 100%)"></div>
  <div style="position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top, rgba(4,6,12,0.86) 0%, rgba(4,6,12,0.28) 30%, rgba(4,6,12,0) 58%)"></div>

  <div style="position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:{{ pad }};gap:18px">

    <div style="display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px;pointer-events:auto">
      <div style="display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;gap:8px;padding:8px;border-radius:999px;border:1px solid transparent;background:linear-gradient(150deg,rgba(255,255,255,0.075),rgba(255,255,255,0.022)) padding-box,linear-gradient(160deg,rgba(255,255,255,0.24),rgba(255,255,255,0.05) 45%,rgba(255,255,255,0.14)) border-box;backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);box-shadow:0 26px 70px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.07)">
          <sc-for list="{{ dims }}" as="dm" hint-placeholder-count="3">
            <button type="button" onClick="{{ dm.pick }}" style-hover="background:rgba(255,255,255,0.14);transform:translateY(-1px)" style-active="transform:translateY(0) scale(0.982)" style="display:flex;align-items:center;gap:12px;padding:8px 16px;border:none;border-radius:999px;cursor:pointer;background:{{ dm.bg }};transition:background .32s cubic-bezier(.16,.84,.44,1),transform .16s cubic-bezier(.16,.84,.44,1);font-family:inherit;text-align:left;will-change:transform">
              <span style="display:flex;align-items:center;gap:8px">
                <span style="width:2px;height:16px;border-radius:2px;background:{{ dm.rule }};transition:background .32s ease"></span>
                <span style="font-family:'IBM Plex Mono',monospace;font-size:10.8px;letter-spacing:0.14em;font-variant-numeric:tabular-nums;color:{{ dm.sub }};min-width:16px">{{ dm.num }}</span>
              </span>
              <span style="display:flex;flex-direction:column;gap:2px">
                <span style="font-size:13px;font-weight:600;letter-spacing:0.01em;color:{{ dm.fg }};white-space:nowrap">{{ dm.name }}</span>
                <span style="font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.16em;color:{{ dm.sub }};white-space:nowrap">{{ dm.tag }}</span>
              </span>
            </button>
          </sc-for>
        </div>

        <div style="display:flex;align-items:center;gap:10px;padding-left:8px">
          <div style="display:flex;gap:4px">
            <sc-for list="{{ ticks }}" as="tk" hint-placeholder-count="5">
              <button type="button" onClick="{{ tk.pick }}" aria-label="{{ tk.label }}" style-hover="height:8px;opacity:1" style="width:{{ tk.w }};height:4px;padding:0;border:none;border-radius:4px;cursor:pointer;background:{{ tk.bg }};opacity:{{ tk.op }};transition:width .34s cubic-bezier(.16,.84,.44,1),height .18s ease,opacity .3s ease"></button>
            </sc-for>
          </div>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.2em;font-variant-numeric:tabular-nums;color:rgba(234,242,248,0.62)">{{ modIndex }}/{{ modCount }} · ← →</span>
        </div>

        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;max-width:min(760px,86vw)">
          <sc-for list="{{ mods }}" as="md" hint-placeholder-count="5">
            <button type="button" onClick="{{ md.pick }}" style-hover="transform:translateY(-1px);border-color:rgba(255,255,255,0.32)" style-active="transform:translateY(0) scale(0.97)" style="display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;cursor:pointer;font-family:inherit;font-size:10.8px;font-weight:600;letter-spacing:0.01em;background:{{ md.bg }};color:{{ md.fg }};border:1px solid {{ md.bd }};backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:background .32s ease,color .32s ease,border-color .32s ease,transform .16s cubic-bezier(.16,.84,.44,1);white-space:nowrap;animation:{{ md.pulse }}">
              <span style="width:5px;height:5px;border-radius:50%;background:{{ md.dot }};transition:background .3s ease"></span>{{ md.n }}
            </button>
          </sc-for>
          <button type="button" onClick="{{ next }}" style-hover="background:rgba(255,255,255,0.12);letter-spacing:0.26em;padding-right:22px" style-active="transform:scale(0.96)" style="display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.2em;background:transparent;color:{{ accent }};border:1px dashed rgba(255,255,255,0.22);transition:background .28s ease,letter-spacing .28s ease,padding .28s ease,transform .16s ease;white-space:nowrap">NEXT →</button>
        </div>
      </div>
    </div>

    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;min-height:0">
      <div style="pointer-events:auto;width:{{ hudW }};max-height:{{ hudMax }};overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.18) transparent;padding:{{ hudPad }};border-radius:26px;border:1px solid transparent;background:radial-gradient(130% 80% at 0% 0%, {{ tint }}, rgba(255,255,255,0) 62%) padding-box,linear-gradient(150deg,rgba(255,255,255,0.08),rgba(255,255,255,0.022)) padding-box,linear-gradient(160deg,rgba(255,255,255,0.26),rgba(255,255,255,0.05) 42%,rgba(255,255,255,0.16)) border-box;backdrop-filter:blur(28px) saturate(150%);-webkit-backdrop-filter:blur(28px) saturate(150%);box-shadow:0 26px 70px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.07);animation:hudUp 0.7s cubic-bezier(.16,.84,.44,1) both">

        <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px">
          <span style="width:6px;height:6px;border-radius:50%;background:{{ accent }};box-shadow:0 0 12px {{ accent }};animation:breathe 3.2s ease-in-out infinite"></span>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.22em;color:rgba(234,242,248,0.62)">{{ kicker }}</span>
          <span style="flex:1;height:1px;background:linear-gradient(to right,rgba(255,255,255,0.14),transparent)"></span>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.14em;font-variant-numeric:tabular-nums;color:rgba(234,242,248,0.34)">{{ modIndex }} / {{ modCount }}</span>
        </div>

        <h1 style="margin:0 0 16px;font-size:{{ headSize }};font-weight:700;line-height:1.04;letter-spacing:-0.015em;display:flex;flex-wrap:wrap;gap:0 0.28em;perspective:620px;text-wrap:balance">
          <sc-for list="{{ words }}" as="w" hint-placeholder-count="4">
            <span style="display:inline-flex">
              <sc-for list="{{ w.chars }}" as="ch" hint-placeholder-count="5">
                <span style="display:inline-block;color:{{ w.c }};animation:{{ ch.a }} 0.66s cubic-bezier(.16,.84,.44,1) both;animation-delay:{{ ch.d }}">{{ ch.t }}</span>
              </sc-for>
            </span>
          </sc-for>
        </h1>

        <p style="margin:0 0 16px;font-size:13px;line-height:1.7;color:rgba(230,239,246,0.78);max-width:62ch;text-wrap:pretty;animation:softIn 1s ease 0.24s both">{{ copy }}</p>

        <div style="display:grid;grid-template-columns:{{ tileCols }};gap:8px">
          <sc-for list="{{ tiles }}" as="tl" hint-placeholder-count="4">
            <div style="grid-column:{{ tl.span }};border-radius:16px;border:1px solid {{ tl.bd }};background:{{ tl.bg }};box-shadow:{{ tl.sh }};transition:border-color .38s cubic-bezier(.16,.84,.44,1),background .38s ease,box-shadow .38s ease;overflow:hidden" style-hover="border-color:rgba(255,255,255,0.24)">
              <button type="button" onClick="{{ tl.pick }}" style-active="transform:scale(0.988)" style="width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border:none;background:transparent;cursor:pointer;font-family:inherit;text-align:left;transition:transform .16s ease">
                <span style="display:flex;align-items:center;gap:10px;min-width:0">
                  <span style="width:2px;height:24px;border-radius:2px;background:{{ tl.rule }};transition:background .34s ease;flex:0 0 auto"></span>
                  <span style="display:flex;flex-direction:column;gap:2px;min-width:0">
                    <span style="font-size:13px;font-weight:600;color:{{ tl.fg }};transition:color 0.3s ease">{{ tl.t }}</span>
                    <span style="font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.18em;color:rgba(234,242,248,0.58)">{{ tl.s }}</span>
                  </span>
                </span>
                <span style="font-family:'IBM Plex Mono',monospace;font-size:15.6px;line-height:1;color:{{ tl.fg }};flex:0 0 auto">{{ tl.sign }}</span>
              </button>
              <sc-if value="{{ tl.open }}" hint-placeholder-val="{{ false }}">
                <div style="padding:0 16px 16px;display:flex;flex-direction:column;gap:8px;animation:softIn 0.42s ease both">
                  <div style="height:1px;background:linear-gradient(to right,{{ tl.bd }},transparent)"></div>
                  <sc-for list="{{ tl.rows }}" as="rw" hint-placeholder-count="3">
                    <div style="display:flex;align-items:baseline;gap:8px">
                      <span style="font-size:10.8px;color:rgba(230,239,246,0.62);flex:0 1 auto">{{ rw.l }}</span>
                      <span style="flex:1 1 16px;min-width:16px;height:1px;background:repeating-linear-gradient(to right,rgba(255,255,255,0.18) 0 1px,transparent 1px 4px);transform:translateY(-3px)"></span>
                      <span style="font-family:'IBM Plex Mono',monospace;font-size:10.8px;letter-spacing:0.04em;font-variant-numeric:tabular-nums;color:rgba(240,247,252,0.94);text-align:right;flex:0 0 auto">{{ rw.v }}</span>
                    </div>
                  </sc-for>
                  <sc-if value="{{ tl.note }}" hint-placeholder-val="{{ false }}">
                    <p style="margin:2px 0 0;font-size:11.5px;line-height:1.62;color:rgba(230,239,246,0.7);text-wrap:pretty">{{ tl.note }}</p>
                  </sc-if>
                  <div style="display:inline-flex;align-self:flex-start;align-items:center;gap:8px;margin-top:4px;padding:5px 10px;border-radius:999px;border:1px solid {{ tl.bd }};background:rgba(255,255,255,0.03)">
                    <span style="width:4px;height:4px;border-radius:50%;background:{{ tl.fg }}"></span>
                    <span style="font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.2em;color:{{ tl.fg }}">CAMERA → {{ tl.cam }}</span>
                  </div>
                </div>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;padding-bottom:8px;flex:{{ markFlex }}">
        <span style="font-size:{{ markSize }};font-weight:300;letter-spacing:0.01em;color:rgba(238,246,252,0.68);text-align:right;white-space:nowrap">არვის მეგობარი — ყველას მოკავშირე.</span>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.3em;color:rgba(238,246,252,0.4)">ARTRON</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;kinetic&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;autoTour&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;tourInterval&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:9,&quot;min&quot;:4,&quot;max&quot;:24,&quot;step&quot;:1,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;showWatermark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;}}">
const TILES = [
  { t: 'მასშტაბი', s: 'SCALE & CAPACITY' },
  { t: 'დისციპლინები', s: 'DISCIPLINES' },
  { t: 'საკვანძო ტექნოლოგია', s: 'TELEMETRY / RFID / BIO' },
  { t: 'უმაღლესი სტანდარტი', s: 'COMPLIANCE' }
];

const D1 = [
  { n: 'ათლეტური ჰაბები', k: 'VEN-01 / MEMBERSHIP HUB', s: 'gym',
    head: 'ერთი ჰაბი. სრული კონტროლი.',
    copy: 'პიკის საათებში დარბაზი იტვირთება, ადმინისტრატორი ხელით ავსებს ჟურნალს და გაუქმებული აბონემენტები ჩუმად ჭამს შემოსავალს. Artron აერთიანებს წევრობას, შესვლის კონტროლს და აღჭურვილობის რეალურ დატვირთვას ერთ ცოცხალ სურათში — გადაწყვეტილება მიიღება მონაცემზე, არა ვარაუდზე.',
    t: [[['საერთო ფართობი', '1 200–8 000 m²'], ['ერთდროული ტევადობა', '450 მომხმარებელი'], ['პიკის ფანჯარა', '18:00 – 21:30']],
        [['ძალოვანი ზონა', 'Free weights · Rack'], ['ფუნქციური', 'HIIT · Cross · Mobility'], ['კარდიო ბლოკი', '64 ერთეული']],
        [['წევრის იდენტიფიკაცია', 'RFID / NFC ბრასლეტი'], ['აღჭურვილობის ტელემეტრია', 'IoT 900+ სენსორი'], ['დატვირთვის რუკა', 'Heatmap 1 წთ ინტერვალი']],
        [['პერსონალურ მონაცემთა დაცვა', 'GDPR · ISO 27001'], ['უსაფრთხოების აუდიტი', 'კვარტალური'], ['ხანძარსაწინააღმდეგო', 'EN 13501 კლასი B']]] },
  { n: 'ოლიმპიური აუზები', k: 'VEN-02 / AQUATIC COMPLEX', s: 'pool',
    head: 'წყალი, რომელიც თავად ანგარიშობს.',
    copy: 'ქლორის ხელით გაზომვა, ბუნდოვანი ბილიკების განრიგი და მოცურავეთა რიგი კომპლექსს ყოველდღე ნერვიულობაში აგდებს. Artron წყლის ქიმიას, ბილიკების დატვირთვას და მაშველთა როტაციას ერთ პროტოკოლში კრავს და გადახრაზე რეაგირებს წუთებში, არა შემოწმების დღეს.',
    t: [[['აუზის ზომა', '50 m · 8 ბილიკი'], ['წყლის მოცულობა', '2 500 m³'], ['დღიური ნაკადი', '1 100 მოცურავე']],
        [['ცურვა', 'თავისუფალი · ბრასი · დელფინი'], ['წყლის პოლო', 'სრული მოედანი'], ['სინქრონული / დაივინგი', '3 m · 5 m პლატფორმა']],
        [['წყლის ქიმია', 'pH · Cl · ORP realtime'], ['ბილიკის აღრიცხვა', 'ოპტიკური მრიცხველი'], ['ტემპერატურა', '±0.2 °C კონტროლი']],
        [['FINA / World Aquatics', 'FR 2 სტანდარტი'], ['სანიტარული ნორმა', 'SanPiN ეკვივალენტი'], ['მაშველთა კოეფიციენტი', '1 : 75 მოცურავე']]] },
  { n: 'ჩოგბურთი და პადელი', k: 'VEN-03 / COURT SYSTEMS', s: 'court',
    head: 'კორტი, რომელიც არასდროს ცარიელია.',

];

class Component extends DCLogic {
  state = { d: 0, m: 0, tile: null, rev: 0, w: window.innerWidth };

  componentDidMount() {
    this._onR = () => { if (Math.abs(window.innerWidth - this.state.w) > 40) this.setState({ w: window.innerWidth }); };
    window.addEventListener('resize', this._onR);
    this._onK = e => {
      if (e.key === 'ArrowRight') this.step(1);
      else if (e.key === 'ArrowLeft') this.step(-1);
      else if (e.key === 'Escape') this.setState({ tile: null });
    };
    window.addEventListener('keydown', this._onK);
    this._tour();
  }

  componentDidUpdate(prev) {
    if (prev.autoTour !== this.props.autoTour || prev.tourInterval !== this.props.tourInterval) this._tour();
  }

  _tour() {
    clearInterval(this._tv);
    if (!this.props.autoTour) return;
    const ms = (this.props.tourInterval ?? 9) * 1000;
    this._tv = setInterval(() => this.setState(s => {
      const mods = DIMS[s.d].mods;
      const next = s.m + 1;
      return next < mods.length
        ? { m: next, tile: null, rev: s.rev + 1 }
        : { d: (s.d + 1) % DIMS.length, m: 0, tile: null, rev: s.rev + 1 };
    }), ms);
  }

  componentWillUnmount() { window.removeEventListener('resize', this._onR); window.removeEventListener('keydown', this._onK); clearInterval(this._tv); }

  step(dir) {
    this.setState(s => {
      const n = DIMS[s.d].mods.length;
      let m = s.m + dir, d = s.d;
      if (m >= n) { d = (s.d + 1) % DIMS.length; m = 0; }
      else if (m < 0) { d = (s.d + DIMS.length - 1) % DIMS.length; m = DIMS[d].mods.length - 1; }
      return { d, m, tile: null, rev: s.rev + 1 };
    });
  }

  pickDim(i) { this.setState(s => ({ d: i, m: 0, tile: null, rev: s.rev + 1 })); }
  pickMod(i) { this.setState(s => ({ m: i, tile: null, rev: s.rev + 1 })); }
  pickTile(i) { this.setState(s => ({ tile: s.tile === i ? null : i })); }

  renderVals() {
    const { d, m, tile, rev, w } = this.state;
    const narrow = w < 830;
    const tiny = w < 620;
    const dim = DIMS[d];
    const mods = dim.mods;
    const mi = Math.min(m, mods.length - 1);
    const mod = mods[mi];
    const accent = dim.accent;
    const kin = this.props.kinetic ?? true;
    const anim = kin ? (rev % 2 ? 'kinB' : 'kinA') : 'softIn';
    const raw = mod.head.split(' ');
    const closed = TILES.map((_, i) => i).filter(i => i !== tile);
    const lastClosed = closed.length % 2 ? closed[closed.length - 1] : -1;
    let ci = 0;
    const words = raw.map((word, wi) => ({
      c: wi === raw.length - 1 ? accent : '#f4f9fd',
      chars: word.split('').map(t => {
        const delay = kin ? (wi * 0.05 + ci * 0.022) : wi * 0.03;
        ci++;
        return { t, a: anim, d: delay.toFixed(3) + 's' };
      })
    }));
    return {
      accent,
      tint: accent + '1f',
      scene: mod.s,
      kicker: mod.k,
      copy: mod.copy,
      words,
      focus: tile === null ? '' : String(tile),
      shift: narrow ? 0 : 0.42,
      next: () => this.step(1),
      ticks: mods.map((x, i) => ({
        label: x.n, pick: () => this.pickMod(i),
        w: i === mi ? '34px' : '14px',
        bg: i === mi ? accent : '#eaf2f8',
        op: i === mi ? 1 : (i === (mi + 1) % mods.length ? 0.5 : 0.22)
      })),
      modIndex: String(mi + 1).padStart(2, '0'),
      modCount: String(mods.length).padStart(2, '0'),
      pad: tiny ? '16px 16px 24px' : (narrow ? '24px 24px 24px' : '32px 40px 40px'),
      hudW: narrow ? '100%' : 'clamp(400px, 40vw, 600px)',
      hudMax: tiny ? '48vh' : (narrow ? '52vh' : '72vh'),
      hudPad: tiny ? '16px' : '24px',
      headSize: tiny ? '27px' : (narrow ? '32.4px' : 'clamp(32.4px, 3.2vw, 46.7px)'),
      tileCols: tiny ? '1fr' : 'repeat(2, minmax(0, 1fr))',

      markSize: tiny ? '10.8px' : '13px',
      dims: DIMS.map((x, i) => ({
        num: x.num, name: x.name, tag: x.sub, pick: () => this.pickDim(i),
        bg: i === d ? 'rgba(255,255,255,0.1)' : 'transparent',
        fg: i === d ? '#f7fbfe' : 'rgba(234,242,248,0.56)',
        rule: i === d ? x.accent : 'rgba(255,255,255,0.14)',
        sub: i === d ? x.accent : 'rgba(234,242,248,0.34)'
      })),
      mods: mods.map((x, i) => ({
        n: x.n, pick: () => this.pickMod(i),
        bg: i === mi ? accent : 'rgba(255,255,255,0.05)',
        fg: i === mi ? '#050811' : 'rgba(234,242,248,0.74)',
        bd: i === mi ? accent : 'rgba(255,255,255,0.1)',
        dot: i === mi ? 'rgba(5,8,17,0.45)' : (i === (mi + 1) % mods.length ? accent : 'rgba(255,255,255,0.22)'),
        pulse: i === (mi + 1) % mods.length ? 'pulseHint 2.6s ease-in-out infinite' : 'none'
      })),
      tiles: TILES.map((tl, i) => ({
        t: tl.t, s: tl.s, open: tile === i, sign: tile === i ? '–' : '+',
        pick: () => this.pickTile(i),
        span: !tiny && (tile === i || i === lastClosed) ? 'span 2' : 'auto',
        cam: (mod.cams || ['WIDE ESTABLISH', 'DISCIPLINE PASS', 'TECH CLOSE-UP', 'STANDARD SWEEP'])[i],
        note: (mod.notes || [])[i] || '',
        bg: tile === i ? 'rgba(255,255,255,0.065)' : 'rgba(255,255,255,0.028)',
        bd: tile === i ? accent + '66' : 'rgba(255,255,255,0.08)',
        rule: tile === i ? accent : 'rgba(255,255,255,0.12)',
        sh: tile === i ? 'inset 0 0 0 1px rgba(255,255,255,0.04), 0 14px 34px rgba(0,0,0,0.34)' : 'none',
        fg: tile === i ? accent : '#eaf2f8',
        rows: (mod.t[i] || []).map(r => ({ l: r[0], v: r[1] }))
      }))
    };
  }
}

</script>
</body>

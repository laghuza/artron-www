<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>ARTRON — Daisi Choreography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+Georgian:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --void-abyss: #020407;
      --void-basalt: #050811;
      --void-crust: #0A0F1D;
      --metal-white: #FFFFFF;
      --metal-plat: #E2E8F0;
      --metal-steel: #94A3B8;
      --metal-dark: #1E293B;
      --metal-shadow: #060911;
      --summit-snow: #FFFFFF;
      --glacial-cyan: #BAE6FD;
      --solar-gold: #D4AF37;
      --aged-bronze: #854D0E;
      --emerald-core: #10B981;
      --glass-obsidian: rgba(6, 10, 18, 0.84);
      --glass-rim: rgba(255, 255, 255, 0.08);
      --glass-specular: rgba(255, 255, 255, 0.22);
      --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --scroll-p: 0;
      --dock-p: 0;
      --dock-pointer: none;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
    ::selection { background: var(--solar-gold); color: #020407; }
    body {
      background-color: var(--void-abyss);
      color: var(--metal-plat);
      font-family: var(--font-primary);
      overflow-x: hidden;
      min-height: 340vh;
    }
    a { color: var(--metal-steel); text-decoration: none; }
    a:hover { color: var(--metal-white); }

    .artron-master-stage {
      position: fixed; inset: 0; width: 100vw; height: 100vh; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      perspective: 1800px; z-index: 1;
      background-color: var(--void-abyss);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% 30%, rgba(186, 230, 253, 0.045) 0%, transparent 75%),
        radial-gradient(ellipse 65% 45% at 50% 70%, rgba(133, 77, 14, 0.06) 0%, transparent 70%),
        radial-gradient(ellipse 95% 75% at 50% 50%, var(--void-crust) 0%, var(--void-basalt) 55%, var(--void-abyss) 100%);
      contain: paint layout;
    }
    .artron-master-stage::before {
      content: ""; position: absolute; inset: 0; opacity: 0.028; pointer-events: none; z-index: 1;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }
    .artron-master-stage::after {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 60%, rgba(2, 4, 7, 0.65) 100%);
      pointer-events: none; z-index: 3;
    }
    #spatialCanvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
    .alpenglow-horizon {
      position: absolute; width: 1260px; height: 700px; border-radius: 50%;
      background:
        radial-gradient(ellipse 60% 45% at 50% 65%, rgba(212, 175, 55, 0.15) 0%, transparent 70%),
        radial-gradient(ellipse 85% 55% at 50% 30%, rgba(56, 189, 248, 0.08) 0%, transparent 75%);
      filter: blur(120px); pointer-events: none; z-index: 1;
      transform: translate3d(0, 0, 0); will-change: transform;
    }
    .monolith-cluster {
      position: relative; z-index: 10; display: flex; align-items: center; justify-content: center;
      gap: 1.6vw; width: min(92vw, 1100px); transform-style: preserve-3d; user-select: none;
      will-change: transform, opacity;
    }
    .letter-box { flex: 1; max-width: 155px; aspect-ratio: 100 / 120; transform-style: preserve-3d; position: relative; }
    .letter-box svg {
      width: 100%; height: 100%; overflow: visible;
      filter: drop-shadow(0 25px 50px rgba(0, 0, 0, 0.98)) drop-shadow(0 0 1px rgba(255, 255, 255, 0.4));
    }
    .facet { transform-style: preserve-3d; transform-box: fill-box; transform-origin: center center; will-change: transform; }
    .slogan-monolith {
      position: absolute; z-index: 12; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; width: min(90vw, 880px); pointer-events: none; opacity: 0;
      will-change: opacity, transform;
    }
    .manifesto {
      position: relative; display: flex; flex-wrap: wrap; justify-content: center; column-gap: 0.42em; row-gap: 0.1em; margin: 0;
      font-family: 'Noto Sans Georgian', var(--font-primary); font-weight: 700;
      font-size: clamp(1.6rem, 4.2vw, 3.9rem); line-height: 1.3;
      perspective: 900px; transform-style: preserve-3d;
    }
    .subline {
      margin: 1.6em 0 0; font-family: 'Noto Sans Georgian', var(--font-primary); font-weight: 400;
      font-size: clamp(13px, 1.1vw, 16px); letter-spacing: 0.32em; color: #94A3B8; opacity: 0;
      transform: translateY(6px); text-wrap: balance;
      background: linear-gradient(100deg, #94A3B8 0%, #94A3B8 38%, #E2E8F0 45%, #FFF4C2 50%, #E2E8F0 55%, #94A3B8 62%, #94A3B8 100%);
      background-size: 300% 100%; background-position: 100% 0;
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .manifesto .word { display: inline-flex; white-space: nowrap; transform-style: preserve-3d; }
    .manifesto .g {
      display: inline-block; opacity: 0; letter-spacing: 0.30em;
      transform: translate3d(0, 18px, -40px);
      background: linear-gradient(135deg, #FFFFFF 0%, #E2E8F0 28%, #94A3B8 68%, #1E293B 100%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      will-change: transform, opacity, letter-spacing, filter;
    }
    /* facet vocabulary borrowed from the ARTRON monolith */
    .manifesto .g.rim {
      background-image:
        linear-gradient(100deg, #D4AF37 0%, rgba(255,244,194,0.7) 18%, rgba(255,255,255,0.3) 30%, transparent 42%),
        linear-gradient(135deg, #FFFFFF 0%, #E2E8F0 28%, #94A3B8 68%, #1E293B 100%);
    }
    .manifesto .g.split {
      background-image:
        linear-gradient(180deg, transparent 54%, #060911 54%, #0F172A 60%, rgba(56,189,248,0.45) 63%, transparent 63%),
        linear-gradient(135deg, #FFFFFF 0%, #E2E8F0 28%, #94A3B8 68%, #1E293B 100%);
    }
    .manifesto .g.edge { -webkit-text-stroke: 0.6px rgba(212,175,55,0.55); }
    .manifesto .g.alpha {
      background-image:
        linear-gradient(100deg, #D4AF37 0%, rgba(255,244,194,0.7) 16%, transparent 34%),
        linear-gradient(180deg, transparent 56%, #060911 56%, #0F172A 62%, rgba(56,189,248,0.5) 65%, transparent 65%),
        linear-gradient(135deg, #FFFFFF 0%, #E2E8F0 28%, #94A3B8 68%, #1E293B 100%);
      -webkit-text-stroke: 0.6px rgba(212,175,55,0.6);
    }
    .velvet-header {
      position: fixed; top: 1.5rem; left: 50%;
      transform: translate3d(-50%, calc(-160% + (var(--dock-p, 0) * 160%)), 0);
      opacity: var(--dock-p, 0); pointer-events: var(--dock-pointer, none);
      z-index: 100; width: min(92%, 1200px); height: 64px; border-radius: 9999px;
      background: var(--glass-obsidian);
      backdrop-filter: blur(45px) saturate(200%); -webkit-backdrop-filter: blur(45px) saturate(200%);
      border: 1px solid var(--glass-rim);
      box-shadow: 0 40px 80px -15px rgba(0, 0, 0, 0.98), inset 0 1px 1px 0 var(--glass-specular);
      display: flex; align-items: center; justify-content: space-between; padding: 0 1.8rem;
    }
    .brand-core { display: flex; align-items: center; gap: 0.85rem; cursor: pointer; }
    .brand-title {
      font-weight: 900; letter-spacing: 0.35em; font-size: 0.95rem;
      background: linear-gradient(135deg, #FFFFFF 0%, #CBD5E1 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .emerald-pulse {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--emerald-core); box-shadow: 0 0 12px var(--emerald-core);
      animation: pulseGlow 2.4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 10px var(--emerald-core); }
      50% { opacity: 0.45; transform: scale(0.85); box-shadow: 0 0 4px var(--emerald-core); }
    }
    .nav-links { display: flex; align-items: center; gap: 2.2rem; list-style: none; }
    .nav-item {
      color: var(--metal-steel); font-size: 0.82rem; font-weight: 500; letter-spacing: 0.06em;
      text-decoration: none; transition: color 0.25s ease; cursor: pointer;
    }
    .nav-item:hover { color: var(--metal-white); text-shadow: 0 0 12px rgba(255, 255, 255, 0.6); }
    .action-group { display: flex; align-items: center; gap: 1.4rem; }
    .lang-indicator { font-size: 0.75rem; color: #64748B; letter-spacing: 0.1em; font-weight: 600; }
    .ignite-os-btn {
      background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.45);
      color: #FFFFFF; padding: 0.55rem 1.3rem; border-radius: 9999px; font-size: 0.8rem;
      font-weight: 600; letter-spacing: 0.05em; cursor: pointer; display: flex; align-items: center;
      gap: 0.6rem; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); font-family: inherit;
    }
    .ignite-os-btn:hover {
      background: rgba(16, 185, 129, 0.2); border-color: rgba(16, 185, 129, 0.9);
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.4); transform: translateY(-1px);
    }
    .scroll-guide {
      position: absolute; bottom: 2.2rem; left: 50%; transform: translateX(-50%);
      font-size: 0.68rem; letter-spacing: 0.4em; color: #64748B; text-transform: uppercase;
      font-weight: 700; opacity: calc(1 - (var(--scroll-p, 0) * 4)); pointer-events: none; z-index: 10;
    }
    @media (max-width: 860px) {
      .nav-links, .lang-indicator { display: none; }
      .velvet-header { padding: 0 1.2rem; height: 56px; }
      .monolith-cluster { gap: 1vw; }
      .bezel-bracket { padding: 1.5rem 1.8rem; }
    }
  </style>
</head>
<body>
  <svg style="position: absolute; width: 0; height: 0; pointer-events: none;" aria-hidden="true">

  <script>
    (function () {
      'use strict';
      const canvas = document.getElementById('spatialCanvas');
      const ctx = canvas.getContext('2d', { alpha: true });
      let w = 0, h = 0, dpr = 1;

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth; h = window.innerHeight;
        canvas.width = w * dpr; canvas.height = h * dpr;
        canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resize, { passive: true });
      resize();

      const TOTAL = 3000, FOV = 850, ANCHOR_Z = -150, TAU = Math.PI * 2;
      // Spline-constrained manifold: every particle = (stream, rail parameter u, fixed Gaussian tube offset). No velocity, no integration.
      const pS = new Uint8Array(TOTAL), pU = new Float32Array(TOTAL), pOX = new Float32Array(TOTAL), pOY = new Float32Array(TOTAL), pOZ = new Float32Array(TOTAL);
      const pR = new Float32Array(TOTAL), pA = new Float32Array(TOTAL), pCol = new Uint8Array(TOTAL), pB = new Uint8Array(TOTAL), pMI = new Uint16Array(TOTAL);
      let builderCount = 0;
      const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
      const gauss = () => { let u = 0; while (!u) u = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * Math.random()); };
      // stream colours: Flow-M steel / bronze / gold, Flow-F glacier / snow
      const SCOL = [[133, 77, 14], [176, 120, 36], [212, 175, 55], [186, 230, 253], [255, 255, 255]];
      const NM = Math.floor(TOTAL * 0.55), NF = TOTAL - NM;
      for (let i = 0; i < TOTAL; i++) {
        const male = i < NM, j = male ? i : i - NM, n = male ? NM : NF, sig = male ? 12 : 8, r = Math.random();
        pS[i] = male ? 0 : 1;
        pU[i] = ((j + Math.random()) / n) * TAU;
        const g2 = () => clamp(gauss(), -2, 2) * sig;
        pOX[i] = g2(); pOY[i] = g2(); pOZ[i] = g2();
        pR[i] = male ? 0.75 + Math.random() * 0.85 : 0.5 + Math.random() * 0.55;
        pA[i] = male ? 0.5 + Math.random() * 0.35 : 0.6 + Math.random() * 0.35;
        pCol[i] = male ? (r < 0.5 ? 0 : r < 0.85 ? 1 : 2) : (r < 0.6 ? 3 : 4);
        if (Math.random() < 0.62) { pB[i] = 1; pMI[i] = builderCount++; }
      }
      // [rgb, alpha, dark(occluding)]
      const PAL = [
        ['255,255,255', 1], ['11,17,31', 1, 1], ['212,175,55', 1], ['194,65,12', 1], ['212,150,60', 1],
        ['203,213,225', 0.9], ['226,232,240', 0.95], ['158,170,184', 0.95], ['133,77,14', 1], ['150,84,38', 1],
        ['190,214,70', 1], ['84,92,108', 1], ['186,230,253', 0.95], ['16,185,129', 1], ['26,24,22', 1, 1], ['176,120,36', 1],
        ['204,32,42', 1], ['128,16,26', 1], ['96,50,24', 1]
      ];
      const PALN = PAL.map(p => p[0].split(',').map(Number));
      const PHI = (1 + Math.sqrt(5)) / 2;
      const norm = v => { const l = Math.hypot(v[0], v[1], v[2]); return [v[0] / l, v[1] / l, v[2] / l]; };
      const randSphere = () => { const u = Math.random() * 2 - 1, t = Math.random() * Math.PI * 2, r = Math.sqrt(1 - u * u); return [r * Math.cos(t), u, r * Math.sin(t)]; };
      const RND = Math.random, sph = randSphere;
      const P = (x, y, z, c, f, g) => ({ x, y, z, c, f: f || 0, g: g || null });
      const fill = (arr, n, fn) => { for (let i = 0; i < n; i++) arr.push(fn(i / n)); };

            X = (460 + 20 * Math.cos(3 * th - gF)) * Math.cos(a); Y = (170 + 12 * Math.sin(3 * th - gF)) * Math.sin(a); Z = 35 * Math.sin(2 * a); ang = a; rip = ripF;
          }
          const ca = Math.cos(ang), sa = Math.sin(ang);
          X = (X + ca * pOX[i]) * S; Y = (Y + sa * pOX[i]) * Sy; Z = (Z + pOZ[i]) * S;
          const zP = 0;
          const sc = FOV / (FOV + zP), dz = FOV / (FOV + Z);
          const ox = cx + X * sc, oy = cy + Y * sc;
          const dAng = Math.atan2(Math.sin(ang), Math.cos(ang)), glow = rip * Math.exp(-dAng * dAng / 0.18);

          // 2 · lock-in progress
          let q = 0, flight = 0;
          if (pB[i] && tl.st) {
            if (tl.st === 1) { const s = clamp(Math.hypot(ox - anA.x, oy - anA.y) / reach, 0, 1); q = clamp((tl.p - 0.4 * s) / 0.6, 0, 1); }
            else if (tl.st === 2) q = 1;
            else { q = 1; flight = smooth(clamp((tl.p - 0.38 * ((pMI[i] * 0.6180339) % 1)) / 0.62, 0, 1)); }
          }
          const hp = smooth(q) * live;
          const inFlight = flight > 0.02 && flight < 0.98;

          let px = ox, py = oy, size = Math.max(pR[i] * sc * dz * (1 + glow * 0.9), 0.5), src = null, zd = 0, dark = 0;
          const oc = SCOL[pCol[i]];
          let cr = oc[0], cg = oc[1], cb = oc[2];
          if (glow > 0.01) { const tg = pS[i] === 0 ? [255, 214, 120] : [255, 236, 190], gk = glow * 0.75; cr += (tg[0] - cr) * gk; cg += (tg[1] - cg) * gk; cb += (tg[2] - cb) * gk; }
          let alpha = Math.min(1, pA[i] * (0.62 + 0.38 * Math.sin(pU[i] * 4 - railClock * 2.2)) * clamp(0.55 + 0.6 * dz, 0.35, 1) * (1 + glow * 1.4));

          if (!pB[i] && holdW > 0) { const dd = Math.hypot(ox - anA.x, oy - anA.y) / (anA.rs * 1.1); alpha *= 1 - 0.8 * holdW * Math.exp(-dd * dd); }
          if (hp > 0) {
            const mi = pMI[i], pa = A.pts[mi % A.n], pb = B.pts[mi % B.n];
            const ea = mi < A.n ? 1 : 0, eb = mi < B.n ? 1 : 0;
            let ax_ = pa.x, az_ = pa.z, bx_ = pb.x, bz_ = pb.z;
            if (pa.g) { const dx = pa.x - pa.g.x, dzz = pa.z - pa.g.z; ax_ = pa.g.x + dx * cG - dzz * sG; az_ = pa.g.z + dx * sG + dzz * cG; }
            if (pb.g) { const dx = pb.x - pb.g.x, dzz = pb.z - pb.g.z; bx_ = pb.g.x + dx * cG - dzz * sG; bz_ = pb.g.z + dx * sG + dzz * cG; }
            let tx, ty, tsc, sh, exists, tr, tg2, tb, pa1;
            if (tl.st !== 3) {
              const m = tl.mix, jj = morphJ * 1.6;
              proj(ax_ + (bx_ - ax_) * m + pOX[i] * jj, pa.y + (pb.y - pa.y) * m + pOY[i] * jj, az_ + (bz_ - az_) * m + pOZ[i] * jj, anA, A.rb);
              tx = PJ.x; ty = PJ.y; tsc = PJ.s; sh = PJ.sh; zd = PJ.z;
              src = m < 0.5 ? pa : pb; exists = ea + (eb - ea) * m;
              const tc = PALN[src.c]; tr = tc[0]; tg2 = tc[1]; tb = tc[2]; pa1 = PAL[src.c][1]; dark = PAL[src.c][2] ? 1 : 0;
            } else {
              proj(ax_, pa.y, az_, anA, A.rb); const x0 = PJ.x, y0 = PJ.y, s0 = PJ.s, h0 = PJ.sh, z0 = PJ.z;
              proj(bx_, pb.y, bz_, anB, B.rb);
              const f = flight, u = 1 - f, arc = Math.sin(Math.PI * f);
              tx = u * u * x0 + 2 * u * f * (cx + pOX[i] * 2.4) + f * f * PJ.x;
              ty = u * u * y0 + 2 * u * f * (ctrlY + pOY[i] * 2.4) + f * f * PJ.y;
              tsc = s0 + (PJ.s - s0) * f; sh = h0 + (PJ.sh - h0) * f; zd = z0 + (PJ.z - z0) * f;
              src = f < 0.5 ? pa : pb; exists = ea + (eb - ea) * f;
              const c0 = PALN[pa.c], c1 = PALN[pb.c], sd = arc * 0.65;
              tr = c0[0] + (c1[0] - c0[0]) * f; tg2 = c0[1] + (c1[1] - c0[1]) * f; tb = c0[2] + (c1[2] - c0[2]) * f;
              tr += (255 - tr) * sd; tg2 += (236 - tg2) * sd; tb += (190 - tb) * sd;
              pa1 = PAL[src.c][1] * (1 - 0.25 * arc); dark = inFlight ? 0 : (PAL[src.c][2] ? 1 : 0);
            }
            px = ox + (tx - ox) * hp; py = oy + (ty - oy) * hp;
            cr += (tr - cr) * hp; cg += (tg2 - cg) * hp; cb += (tb - cb) * hp;
            const mA = (dark ? pa1 : pa1 * sh) * exists;
            alpha += (mA - alpha) * hp;
            let mSize = (0.95 + sh * 0.85) * tsc * (mobile ? 1.1 : 1) * (dark ? 1.3 : 1);
            if (tl.st === 3) mSize *= 1 - 0.3 * Math.sin(Math.PI * flight);
            size += (mSize - size) * hp;
            if (src.f === 1) { size *= 1 + hp * (0.2 + pulse * 1.1); alpha = Math.min(1, alpha * (1 - hp * 0.3 * (1 - pulse))); }
            else if (src.f === 2) alpha *= 1 - hp * 0.55 * (0.5 - 0.5 * Math.sin(now * 0.005 + i * 0.7));
          }

          if (mouse.on > 0.01) {
            const mdx = px - mouse.x, mdy = py - mouse.y, md = Math.hypot(mdx, mdy) || 1, f = Math.exp(-(md / MR) * (md / MR)) * mouse.on * (1 - hp * 0.85);
            if (f > 0.002) { const ux = mdx / md, uy = mdy / md, sw = pS[i] === 0 ? 0.35 : -0.45, cap = (pS[i] === 0 ? 14 : 10) * S; px += (ux + uy * sw) * f * cap; py += (uy - ux * sw) * f * cap; alpha = Math.min(1, alpha * (1 + f * 0.6)); }
          }
          // 3 · keep-out sanctuary around the wordmark (applies to rail dust and to dust in flight)
          const kw = inFlight ? 1 : 1 - hp;
          const ex = (px - cx) / KA, ey = (py - cy) / KB, e = Math.sqrt(ex * ex + ey * ey);
          if (kw > 0.001 && e > 0.001 && e < 1.3) { const f = 1 + (smax(e, 1.06, 0.14) / e - 1) * kw; px = cx + (px - cx) * f; py = cy + (py - cy) * f; }

          if (depth > 0.001) { px = cx + (px - cx) * depthK; py = cy + (py - cy) * depthK; size = Math.max(size * depthK, 0.5); alpha *= depthA; }
          if (px < -30 || px > w + 30 || py < -30 || py > h + 30 || alpha < 0.01) continue;
          const rgb = (cr | 0) + ',' + (cg | 0) + ',' + (cb | 0);
          if (hp > 0.6 && !inFlight) {
            oX[oN] = px; oY[oN] = py; oS[oN] = size; oZ[oN] = zd; oA[oN] = alpha; oC[oN] = rgb; oF[oN] = src && src.f && hp > 0.5 ? 1 : 0; oN++;
            continue;
          }
          ctx.beginPath(); ctx.arc(px, py, Math.max(size, 0.3), 0, 6.2832);
          ctx.fillStyle = 'rgba(' + rgb + ',' + alpha.toFixed(3) + ')'; ctx.fill();
        }
        // 4 · solid sculpture pass, far → near
        if (oN) {
          oI.length = oN; for (let j = 0; j < oN; j++) oI[j] = j;
          oI.sort((a, b) => oZ[b] - oZ[a]);
          ctx.globalCompositeOperation = 'source-over';
          for (let n = 0; n < oN; n++) {
            const j = oI[n];
            if (!(oS[j] > 0)) continue;
            ctx.beginPath(); ctx.arc(oX[j], oY[j], oS[j], 0, 6.2832);
            ctx.fillStyle = 'rgba(' + oC[j] + ',' + oA[j].toFixed(3) + ')'; ctx.fill();
            if (oF[j]) { ctx.beginPath(); ctx.arc(oX[j], oY[j], oS[j] * 3.2, 0, 6.2832); ctx.fillStyle = 'rgba(' + oC[j] + ',' + (oA[j] * 0.14).toFixed(3) + ')'; ctx.fill(); }
          }
        }
        ctx.globalCompositeOperation = 'source-over';
        if (tl.st) {
          let laA = 0, laB = 0;
          if (tl.st === 1) laA = smooth(clamp((tl.p - 0.55) / 0.45, 0, 1));
          else if (tl.st === 2) { laA = 1 - smooth(clamp(tl.mix * 3, 0, 1)); laB = A === B ? 0 : smooth(clamp((tl.mix - 0.67) * 3, 0, 1)); }
          else { laA = 1 - smooth(clamp(tl.p * 5, 0, 1)); laB = smooth(clamp((tl.p - 0.85) / 0.15, 0, 1)); }
          drawLines(A, anA, laA * live); if (B !== A) drawLines(B, anB, laB * live);
        }
      }
      requestAnimationFrame(renderFrame);

      const monolithCluster = document.getElementById('monolithCluster');
      const sloganNode = document.getElementById('sloganNode');
      // glyph assembly: each word owns a scroll window; glyphs stagger inside it (scroll-bound, no timers)
      const WORDS = [['მოძრაობა', 0.42, 0.52, false], ['იბადება', 0.50, 0.60, false], ['კავშირში', 0.58, 0.68, true]];
      const manifesto = document.getElementById('manifesto');
      const subline = document.getElementById('subline');
      const GLYPHS = [];
      WORDS.forEach(([w, a, b, gold], wi) => {
        const wEl = document.createElement('span'); wEl.className = 'word' + (gold ? ' gold' : ''); wEl.setAttribute('aria-hidden', 'true');
        const chars = [...w], n = chars.length, len = (b - a) * 0.42;
        const CYCLE = ['', 'rim', '', 'split', 'rim edge', '', 'split', 'rim'];
        chars.forEach((c, i) => {
          const g = document.createElement('span');
          const v = c === 'ა' ? 'alpha' : CYCLE[(GLYPHS.length + wi * 3) % CYCLE.length];
          g.className = 'g' + (v ? ' ' + v : ''); g.textContent = c;
          if (i === n - 1) g.style.letterSpacing = '0';
          wEl.appendChild(g);
          GLYPHS.push({ el: g, s: a + (b - a - len) * (n > 1 ? i / (n - 1) : 0), len, gold, last: i === n - 1, u: 0 });
        });
        manifesto.appendChild(wEl);
      });
      const GLYPH_N = GLYPHS.length; GLYPHS.forEach((g, i) => g.u = i / (GLYPH_N - 1));
      function assemble(p) {
        const lock = smooth(clamp((p - 0.68) / 0.06, 0, 1));
        const beamX = -0.15 + 1.3 * clamp((p - 0.68) / 0.06, 0, 1), beamOn = p > 0.68 && p < 0.74;
        for (const g of GLYPHS) {
          const e = smooth(clamp((p - g.s) / g.len, 0, 1));
          const st = g.el.style;
          st.opacity = e.toFixed(3);
          st.transform = `translate3d(0, ${(18 * (1 - e)).toFixed(2)}px, ${(-40 * (1 - e)).toFixed(2)}px)`;
          if (!g.last) st.letterSpacing = (0.30 - 0.16 * e).toFixed(4) + 'em';
          const crest = g.gold ? e : e * (0.35 + 0.65 * lock);
          const beam = beamOn ? Math.exp(-Math.pow((beamX - g.u) / 0.07, 2)) : 0;
          st.filter = `brightness(${(1 + 0.55 * beam).toFixed(3)}) drop-shadow(0 -1px 0 rgba(212,175,55,${Math.min(1, crest + beam).toFixed(3)})) drop-shadow(0 7px 9px rgba(10,13,20,${(0.95 * e).toFixed(3)}))`;
        }
      }
      const aurora = document.getElementById('auroraGlow');
      const root = document.documentElement;
      const $ = id => document.getElementById(id);
      const FACETS = [
        ['a-pillar-left', p => `translate(${-25 * p}px, 0) rotate(${-8 * p}deg)`],
        ['a-pillar-right', p => `translate(${25 * p}px, 0) rotate(${8 * p}deg)`],
        ['a-bridge', p => `translate(0, ${15 * p}px) scale(${1 - 0.25 * p})`],
        ['t-wing-left', p => `translate(${-35 * p}px, 0)`],
        ['t-wing-right', p => `translate(${35 * p}px, 0)`],
        ['t-column', p => `translate(0, ${25 * p}px) scaleY(${1 - 0.15 * p})`],
        ['o-iris-tl', p => `translate(${-28 * p}px, ${-28 * p}px) rotate(${-15 * p}deg)`],
        ['o-iris-tr', p => `translate(${28 * p}px, ${-28 * p}px) rotate(${15 * p}deg)`],
        ['o-iris-bl', p => `translate(${-28 * p}px, ${28 * p}px) rotate(${15 * p}deg)`],
        ['o-iris-br', p => `translate(${28 * p}px, ${28 * p}px) rotate(${-15 * p}deg)`],
        ['r1-leg', p => `translate(${20 * p}px, ${15 * p}px) rotate(${12 * p}deg)`],
        ['r2-leg', p => `translate(${20 * p}px, ${15 * p}px) rotate(${12 * p}deg)`],
        ['r1-cam', p => `translate(${10 * p}px, ${-14 * p}px)`],
        ['r2-cam', p => `translate(${10 * p}px, ${-14 * p}px)`],
        ['n-diagonal', p => `scale(${1 - 0.2 * p})`],
        ['n-upright-left', p => `translate(${-16 * p}px, 0)`],
        ['n-upright-right', p => `translate(${16 * p}px, 0)`]
      ].map(([id, fn]) => [$(id), fn]).filter(f => f[0]);
      let ticking = false;

      function onScroll() {
        const p = Math.min(Math.max(window.scrollY / 560, 0), 1);
        scrollProgress = p;
        root.style.setProperty('--scroll-p', p);
        const fp = smooth(Math.min(p * 2.6, 1));
        for (const [el, fn] of FACETS) el.style.transform = fn(fp);
        const lOp = p >= 0.30 ? 0 : 1 - smooth(clamp((p - 0.12) / 0.18, 0, 1));
        monolithCluster.style.opacity = lOp;
        monolithCluster.style.visibility = lOp <= 0 ? 'hidden' : 'visible';
        monolithCluster.style.transform = `scale(${1 - p * 0.08}) translate3d(0, ${-25 * p}px, 0)`;
        // glyph assembly 0.42 → 0.68 · full lock + beam 0.68 → 0.74 · ascend into header 0.74 → 0.76
        assemble(p);
        const sUp = smooth(clamp((p - 0.84) / 0.08, 0, 1));
        const sloganOpacity = p < 0.42 || p >= 0.92 ? 0 : 1 - sUp;
        const sY = -sUp * (window.innerHeight * 0.5 - 48), sZ = 0, sS = 1 - 0.08 * sUp;
        const subP = smooth(clamp((p - 0.66) / 0.08, 0, 1));
        subline.style.opacity = (subP * 0.9).toFixed(3);
        subline.style.transform = `translateY(${(6 * (1 - subP)).toFixed(2)}px)`;
        const shine = smooth(clamp((p - 0.72) / 0.10, 0, 1));
        subline.style.backgroundPosition = `${(100 - 100 * shine).toFixed(2)}% 0`;
        sloganNode.style.opacity = sloganOpacity;
        sloganNode.style.visibility = sloganOpacity <= 0 ? 'hidden' : 'visible';
        sloganNode.style.filter = sUp > 0 ? `blur(${(sUp * 6).toFixed(2)}px)` : 'none';
        sloganNode.style.transform = `translate(-50%, -50%) translate3d(0, ${sY}px, ${sZ}px) scale(${sS})`;
        const dockProgress = smooth(clamp((p - 0.84) / 0.12, 0, 1));
        root.style.setProperty('--dock-p', dockProgress);
        root.style.setProperty('--dock-pointer', dockProgress > 0.85 ? 'auto' : 'none');
        aurora.style.transform = `scale(${1 + p * 0.35}) translate3d(0, ${-30 * p}px, 0)`;
        ticking = false;
      }
      window.addEventListener('scroll', () => {
        if (!ticking) { requestAnimationFrame(onScroll); ticking = true; }
      }, { passive: true });
      onScroll();
    })();
  </script>
</body>
